[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twish-eventos-discord"
version = "1.0.0"
description = "Avisa no Discord quando começa, muda ou termina um evento no Twish."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["twish", "discord", "webhook", "eventos"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
twish-eventos = "twish_eventos_discord:main"

[tool.setuptools]
py-modules = ["twish_eventos_discord"]
